name: Build ISO
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld nasm xorriso curl ca-certificates
      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          $HOME/.cargo/bin/rustup target add x86_64-unknown-none
      - name: Build
        run: make all
      - uses: actions/upload-artifact@v4
        with:
          name: avlos-iso
          path: build/*.iso
