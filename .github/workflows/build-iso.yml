name: Build AVL OS ISO
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: Build ISO
        run: sudo env COMP=xz WITH_FIRMWARE=1 OUT=$PWD/out bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: avlos-iso
          path: out/avlos.iso
          compression-level: 0
