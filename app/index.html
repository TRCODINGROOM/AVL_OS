<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AVL OS</title>
<style>
:root{color-scheme:dark;--bg:#070b11;--panel:#0f151d;--panel2:#141c26;--line:#1f2a38;--tx:#e8f4f8;--mute:#8195a8;--ac:#22d3ee;--acd:#134e5a;--red:#ef4444}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#wall{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#0d1620,#05080d)}
#wall svg{position:absolute;top:30%;left:0;width:100%;height:40%}
#lock{position:absolute;inset:0;z-index:9999;background:radial-gradient(circle at 50% 45%,#0f1a22,#0a0e14 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .4s}
#lock.off{opacity:0;pointer-events:none}
#lock .brand{position:absolute;top:26px;left:30px;color:var(--mute);font-weight:600;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.lg{width:44px;height:26px}
#lt{font-size:clamp(64px,14vw,130px);font-weight:200;letter-spacing:.02em}
#lt i{color:var(--ac);font-style:normal;text-shadow:0 0 18px var(--ac)}
#ld{color:var(--mute);font-size:18px;margin-top:4px}
#lh{position:absolute;bottom:12%;color:var(--mute);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
#desk{position:absolute;inset:0 0 48px 0;padding:22px 20px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:16px}
.ic{width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;text-align:center}
.tile{width:48px;height:48px;border-radius:12px;background:#0f1a24;border:1px solid var(--line);display:grid;place-items:center;font-weight:700}
.ic:hover .tile{border-color:var(--ac)}
svg.i{width:24px;height:24px;stroke:var(--ac);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#bar{position:absolute;left:0;right:0;bottom:0;height:48px;background:#0c1219;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:8000}
#start{padding:4px 6px;border-radius:8px}#start:hover{background:var(--panel2)}
#tasks{display:flex;gap:6px;flex:1;overflow:hidden}
.tb{padding:6px 14px;border-radius:8px;background:var(--panel2);white-space:nowrap;position:relative}
.tb.act{background:#1a2735}.tb.act::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--ac);border-radius:2px}
#tray{display:flex;gap:14px;align-items:center;color:var(--mute);font-size:13px}
#tray button{display:flex;align-items:center;gap:4px;opacity:.9}
#tray svg.i{width:18px;height:18px;stroke:var(--mute)}
#tray .off svg.i{opacity:.35}
#clock{text-align:right;line-height:1.15}#clock b{display:block;color:var(--tx);font-size:13px}
#menu{position:absolute;left:10px;bottom:56px;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:none;z-index:9000}
#menu button{display:flex;gap:10px;align-items:center;width:100%;padding:8px;border-radius:8px;text-align:left}
#menu button:hover{background:var(--panel2)}#menu .tile{width:30px;height:30px;border-radius:8px}#menu svg.i{width:17px;height:17px}
#menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.win{position:absolute;background:rgba(15,21,29,.97);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55);min-width:300px;min-height:200px;max-width:100vw}
.wh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;color:var(--mute);border-bottom:1px solid var(--line);cursor:move;touch-action:none}
.wh button{padding:0 8px;font-size:16px;color:var(--mute)}.wh button:hover{color:var(--tx)}
.wb{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;user-select:text}
input,textarea{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;outline:none;user-select:text}
input:focus,textarea:focus{border-color:var(--ac)}
.pill{background:var(--acd);color:var(--ac);border-radius:999px;padding:4px 14px;font-weight:600;font-size:13px}
.pill.off{background:var(--panel);color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;gap:10px}
.row.on{background:#12444d;color:var(--ac)}
.sec{background:var(--panel2);border-radius:12px;padding:10px;margin:0 16px 12px}
.sec h3{font-size:14px;padding:4px 12px 8px;display:flex;justify-content:space-between;align-items:center}
.mute{color:var(--mute)}.sm{font-size:12px}
.cat{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px}.cat button{padding:5px 14px;border-radius:999px;background:var(--panel2);color:var(--mute);white-space:nowrap}.cat button.on{background:var(--acd);color:var(--ac)}
.app{display:flex;align-items:center;gap:14px;padding:10px 16px}.app>div:nth-child(2){flex:1}.app .tile{width:44px;height:44px}
#term{padding:14px;font:13px/1.55 "DejaVu Sans Mono",ui-monospace,Menlo,Consolas,monospace;color:#a5e4f2;flex:1;overflow:auto;white-space:pre-wrap;word-break:break-all}
.tin{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-family:"DejaVu Sans Mono",ui-monospace,monospace}
.tin input{flex:1;border:0;background:none;padding:0;color:#a5e4f2;border-radius:0}
.tool{display:flex;gap:6px;padding:8px 10px;align-items:center}.tool input{flex:1;border-radius:999px;padding:6px 14px}
.tool button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel2)}.tool button:hover{background:#1a2735}
.tool svg.i{width:16px;height:16px;stroke:var(--tx)}
.tabs{display:flex;gap:4px;padding:6px 8px 0;overflow-x:auto;background:#0c1219}
.tab{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:8px 8px 0 0;background:var(--panel);color:var(--mute);max-width:200px;min-width:90px;font-size:13px}
.tab.act{background:var(--panel2);color:var(--tx)}.tab span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}.tab b{font-weight:400;padding:0 4px;border-radius:5px}.tab b:hover{background:var(--line)}
.view{flex:1;position:relative;background:#fff}.view webview,.view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.vmsg{position:absolute;inset:0;background:var(--panel);display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mute);text-align:center;padding:30px}
.fold{display:flex;flex-wrap:wrap;gap:14px;padding:14px;align-content:flex-start;flex:1;overflow:auto}
.fi{width:92px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;text-align:center;padding:6px;border-radius:8px;word-break:break-all}.fi:hover,.fi.sel{background:var(--panel2)}
.prev{width:200px;border:1px solid var(--line);border-radius:12px;margin:10px;padding:12px;background:var(--panel);overflow:auto;font-size:12px}
.toast{position:absolute;right:16px;bottom:62px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;z-index:9500;display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="lgg" x1="0" x2="1"><stop offset="0" stop-color="#3ee0b8"/><stop offset="1" stop-color="#2f6fd8"/></linearGradient>
<symbol id="logo" viewBox="0 0 100 60"><g fill="none" stroke="url(#lgg)" stroke-width="2.2" stroke-linecap="round"><path d="M2 34C22 8 44 4 62 28S90 44 98 30"/><path d="M2 38C22 14 44 9 62 30S90 46 98 36"/><path d="M2 42C22 20 44 14 62 32S90 48 98 42"/><path d="M2 46C22 26 44 19 62 34S90 50 98 48"/><path d="M2 50C22 32 44 24 62 36S90 52 98 54"/></g></symbol></defs></svg>
<div id="wall"><svg viewBox="0 0 1200 300" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3ee0b8"/><stop offset=".5" stop-color="#2f8fd8"/><stop offset="1" stop-color="#2447c9"/></linearGradient></defs>
<g fill="none" stroke="url(#g)" stroke-width="1.4" opacity=".7"><path d="M0 200C200 220 260 60 480 110S760 230 940 170 1120 70 1200 90"/><path d="M0 190C200 215 270 75 480 120S760 220 940 160 1120 80 1200 100"/><path d="M0 180C200 205 280 90 480 130S760 210 940 150 1120 90 1200 110"/><path d="M0 210C220 230 250 50 480 100S780 240 940 180 1120 60 1200 80"/><path d="M0 170C200 195 290 105 480 140S760 200 940 140 1120 100 1200 120"/><path d="M0 220C230 240 240 40 480 90S790 250 940 190 1120 50 1200 70"/></g></svg></div>
<div id="desk"></div><div id="menu"></div><div class="toast" id="toast"></div>
<div id="bar"><button id="start" aria-label="Start menu"><svg class="lg" style="width:34px;height:20px"><use href="#logo"/></svg></button><div id="tasks"></div>
<div id="tray"><button id="tWifi"></button><button id="tBt"></button><button id="tVol"></button><button id="tBat" style="display:none"></button><div id="clock"><b>--:--</b><span class="mute sm"></span></div></div></div>
<div id="lock"><div class="brand"><svg class="lg"><use href="#logo"/></svg>AVL.OS</div><div id="lt"></div><div id="ld"></div><div id="lh"><svg class="i" viewBox="0 0 24 24" style="stroke:var(--mute)"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><svg class="i" viewBox="0 0 24 24" style="stroke:var(--mute);width:16px"><path d="M6 15l6-6 6 6"/></svg>Click anywhere to unlock</div></div>
<script>
'use strict';
const $=s=>document.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const pad=n=>String(n).padStart(2,'0'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NATIVE=!!(window.avl&&window.avl.native);
const call=(n,...a)=>NATIVE?window.avl.call(n,...a):Promise.resolve(null);
let store=null;try{store=window.localStorage}catch(e){}
const sget=(k,d)=>{try{const v=store&&store.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const sset=(k,v)=>{try{store&&store.setItem(k,JSON.stringify(v))}catch(e){}};
const P={notes:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/>',terminal:'<path d="M4 6l6 6-6 6M12 18h8"/>',settings:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',files:'<path d="M3 7h6l2 2h10v10H3z"/>',yadu:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',store:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 016 0v2"/>',
wifi:'<path d="M2 9a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0"/><circle cx="12" cy="19.2" r=".6"/>',bt:'<path d="M7 7l10 10-5 4V3l5 4L7 17"/>',vol:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6"/>',bat:'<rect x="3" y="8" width="15" height="9" rx="2"/><path d="M21 11v3"/>',power:'<path d="M12 3v9M6.3 6.3a8 8 0 1011.4 0"/>',back:'<path d="M15 5l-7 7 7 7"/>',fwd:'<path d="M9 5l7 7-7 7"/>',reload:'<path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/>',stop:'<path d="M6 6l12 12M18 6L6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>',up:'<path d="M12 19V5M6 11l6-6 6 6"/>'};
const ico=(k,cls)=>'<svg class="i" viewBox="0 0 24 24"'+(cls?' style="'+cls+'"':'')+'>'+P[k]+'</svg>';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function tick(){const d=new Date();$('#lt').innerHTML=pad(d.getHours())+'<i>:</i>'+pad(d.getMinutes());$('#ld').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
 $('#clock').innerHTML='<b>'+pad(d.getHours())+':'+pad(d.getMinutes())+'</b><span class="mute sm">'+MON[d.getMonth()]+' '+d.getDate()+'</span>'}
tick();setInterval(tick,10000);
const unlock=()=>$('#lock').classList.add('off');
$('#lock').onclick=unlock;addEventListener('keydown',()=>{if(!$('#lock').classList.contains('off'))unlock()});
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
const wins={};let z=10,n=0;
function openApp(id,arg){
  const a=APPS[id];if(!a)return null;
  if(wins[id]){const w=wins[id];w.el.style.display='flex';focus(id);if(arg&&w.nav)w.nav(arg);return w}
  const w=el('div','win'),wh=el('div','wh','<span>'+a.t+'</span><span><button title="Minimize">–</button><button title="Close">✕</button></span>'),wb=el('div','wb');
  const W=Math.min(a.w||620,innerWidth-16),H=Math.min(a.h||430,innerHeight-70);
  Object.assign(w.style,{width:W+'px',height:H+'px',left:Math.max(8,Math.min(110+n*30,innerWidth-W-8))+'px',top:(24+n*26)%130+'px'});n=(n+1)%6;
  w.append(wh,wb);document.body.append(w);
  const tb=el('button','tb',a.t);$('#tasks').append(tb);const rec=wins[id]={el:w,tb};
  tb.onclick=()=>{if(w.style.display==='none'){w.style.display='flex';focus(id)}else if(tb.classList.contains('act')){w.style.display='none';tb.classList.remove('act')}else focus(id)};
  const [mn,cl]=wh.querySelectorAll('button');mn.onclick=()=>{w.style.display='none';tb.classList.remove('act')};
  cl.onclick=()=>{if(rec.close)rec.close();w.remove();tb.remove();delete wins[id]};
  let dx,dy,drag=false;wh.onpointerdown=e=>{if(e.target.closest('button'))return;drag=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;wh.setPointerCapture(e.pointerId);focus(id)};
  wh.onpointermove=e=>{if(drag){w.style.left=Math.max(-W+80,Math.min(e.clientX-dx,innerWidth-80))+'px';w.style.top=Math.max(0,Math.min(e.clientY-dy,innerHeight-100))+'px'}};wh.onpointerup=()=>drag=false;
  w.onpointerdown=()=>focus(id);a.f(wb,rec,arg);focus(id);$('#menu').style.display='none';return rec}
function focus(id){z++;wins[id].el.style.zIndex=z;for(const k in wins)wins[k].tb.classList.toggle('act',k===id)}
const APPS={
notes:{t:'Notes',w:560,f(b){const t=el('input');t.placeholder='Untitled Note';t.value=sget('avl.nt','');t.style.margin='12px';
 const x=el('textarea');x.style.cssText='flex:1;margin:0 12px 12px;resize:none;font-family:"DejaVu Sans Mono",ui-monospace,monospace';x.value=sget('avl.nb','Welcome to AVL.OS Notes\n\nStart typing your ideas here...');
 let tm;const save=()=>{sset('avl.nt',t.value);sset('avl.nb',x.value);clearTimeout(tm);tm=setTimeout(()=>call('writeText','Documents/'+((t.value||'Untitled Note').replace(/[^\w .-]/g,'_'))+'.txt',x.value),800)};
 t.oninput=save;x.oninput=save;b.append(t,x)}},
terminal:{t:'Terminal',w:640,f(b){const o=el('div');o.id='term';o.textContent='AVL.OS Terminal v2.0\nType "help" for available commands.\n';
 const r=el('div','tin','<span style="color:var(--ac)">$</span>'),i=el('input');i.placeholder='Type a command...';r.append(i);b.append(o,r);let cwd=null;const hist=[];let hp=0;
 const add=s=>{o.append(document.createTextNode(s+'\n'));o.scrollTop=o.scrollHeight};
 i.onkeydown=async e=>{if(e.key==='ArrowUp'){if(hp>0)i.value=hist[--hp]||'';return}if(e.key==='ArrowDown'){if(hp<hist.length)i.value=hist[++hp]||'';return}
  if(e.key!=='Enter')return;const v=i.value.trim();i.value='';if(!v)return;hist.push(v);hp=hist.length;add('$ '+v);
  if(v==='clear'){o.textContent='';return}if(v==='help'){add('Built-in: help, clear, about, version, shutdown, reboot\nAnything else runs as a real Linux command (ls, pwd, nmcli, ip a, ...).');return}
  if(v==='about'){add('AVL.OS, a desktop OS with a real web browser.');return}if(v==='version'){add('AVL.OS v2.0.0');return}
  if(v==='shutdown'){add('Shutting down...');call('power','off');return}if(v==='reboot'){add('Rebooting...');call('power','reboot');return}
  if(!NATIVE){add('Real commands only work inside AVL OS.');return}const r2=await call('exec',v,cwd);if(r2){cwd=r2.cwd;if(r2.out)add(r2.out)}};
 setTimeout(()=>i.focus(),50)}},
settings:{t:'Settings',w:560,h:560,f(b,rec){let busy={};const root=el('div');b.append(root);let S={},wl=null,bd=null,askSsid=null;
 const sec=(title,right,html)=>'<div class="sec"><h3>'+title+'<span>'+(right||'')+'</span></h3>'+html+'</div>';
 async function load(){if(!NATIVE){draw();return}const [ns,bs,inf,vol]=await Promise.all([call('netStatus'),call('btStatus'),call('info'),call('volGet')]);S={ns,bs,inf,vol};draw()}
 function draw(){let h='<h2 style="padding:14px 16px 10px;font-size:18px">System Settings</h2>';
  if(!NATIVE){root.innerHTML=h+sec('Preview mode','','<div class="row mute">Wi‑Fi, Bluetooth, sound and power only work inside AVL OS.</div>');return}
  const ns=S.ns||{},bs=S.bs||{},inf=S.inf||{},vol=S.vol||{};
  const eth=(ns.devs||[]).filter(d=>d.type==='ethernet'||d.type==='wifi');
  h+=sec('Network','','<div class="row"><span>Connection</span><span class="mute">'+esc((inf.ips||[]).join(', ')||'Not connected')+'</span></div>'+eth.map(d=>'<div class="row sm"><span>'+esc(d.device)+' ('+esc(d.type)+')</span><span class="mute">'+esc(d.state)+(d.conn&&d.conn!=='--'?' · '+esc(d.conn):'')+'</span></div>').join(''));
  h+=sec('Wi‑Fi','<button class="pill'+(ns.wifiRadio?'':' off')+'" data-a="wifi">'+(ns.wifiRadio?'On':'Off')+'</button>',
   !ns.hasWifi?'<div class="row mute">No Wi‑Fi adapter found. In a virtual machine this is normal; on a laptop or with a USB Wi‑Fi adapter, networks appear here.</div>':
   (ns.wifiRadio?('<div class="row"><button class="pill" data-a="wscan">'+(busy.wscan?'Scanning…':'Scan for networks')+'</button></div>'+((wl&&wl.list)||[]).map(n=>'<div class="row'+(n.active?' on':'')+'" data-ssid="'+esc(n.ssid)+'" data-sec="'+(n.secure?1:0)+'" style="cursor:pointer"><span>'+esc(n.ssid)+(n.secure?' 🔒':'')+'</span><span class="mute">'+(n.active?'Connected':n.signal+'%')+'</span></div>'+(askSsid===n.ssid?'<div class="row"><input id="wpw" type="password" placeholder="Password" style="flex:1"><button class="pill" data-a="wgo">Connect</button></div>':'')).join('')+(wl&&wl.msg?'<div class="row sm mute">'+esc(wl.msg)+'</div>':'')):'<div class="row mute">Wi‑Fi is off.</div>'));
  h+=sec('Bluetooth',bs.has?'<button class="pill'+(bs.powered?'':' off')+'" data-a="bt">'+(bs.powered?'On':'Off')+'</button>':'',
   !bs.has?'<div class="row mute">No Bluetooth adapter found. In VMware you can pass a USB Bluetooth adapter to the VM; on a laptop it appears here.</div>':
   (bs.powered?('<div class="row"><button class="pill" data-a="bscan">'+(busy.bscan?'Scanning… (6 s)':'Scan for devices')+'</button></div>'+((bd&&bd.list)||[]).map(d=>'<div class="row'+(d.connected?' on':'')+'"><span>'+esc(d.name)+'</span><button class="pill'+(d.connected?'':' off')+'" data-mac="'+esc(d.mac)+'" data-c="'+(d.connected?1:0)+'">'+(d.connected?'Disconnect':'Connect')+'</button></div>').join('')+(bd&&bd.msg?'<div class="row sm mute">'+esc(bd.msg)+'</div>':'')):'<div class="row mute">Bluetooth is off.</div>'));
  h+=sec('Sound','','<div class="row">'+ico('vol')+'<input id="vol" type="range" min="0" max="100" value="'+(vol.vol||0)+'" style="flex:1;padding:0"><span class="mute" style="width:42px;text-align:right">'+(vol.ok?vol.vol+'%':'n/a')+'</span></div>');
  h+=sec('This computer','','<div class="row sm"><span>Processors</span><span>'+inf.cpus+'</span></div><div class="row sm"><span>Memory</span><span>'+inf.memFree+' MB free of '+inf.memTotal+' MB</span></div><div class="row sm"><span>Kernel</span><span>Linux '+esc(inf.kernel||'')+'</span></div>'+(inf.battery!=null?'<div class="row sm"><span>Battery</span><span>'+inf.battery+'%</span></div>':''));
  h+=sec('Power','','<div class="row"><button class="pill off" data-a="reboot">Restart</button><button class="pill off" data-a="off">Shut down</button></div>');
  root.innerHTML=h}
 root.addEventListener('click',async e=>{const t=e.target.closest('[data-a],[data-ssid],[data-mac]');if(!t)return;const a=t.dataset.a;
  if(a==='wifi'){await call('wifiPower',!S.ns.wifiRadio);wl=null;setTimeout(load,800)}
  else if(a==='wscan'){busy.wscan=1;draw();wl=await call('wifiList');busy.wscan=0;draw()}
  else if(t.dataset.ssid&&!a){if(t.dataset.sec==='1'&&!t.classList.contains('on')){askSsid=t.dataset.ssid;draw();const p=$('#wpw');if(p)p.focus()}else{wl.msg='Connecting…';draw();const r=await call('wifiConnect',t.dataset.ssid,'');wl=await call('wifiList');wl.msg=r.ok?'Connected.':r.msg;load()}}
  else if(a==='wgo'){const pw=$('#wpw').value,ss=askSsid;askSsid=null;wl.msg='Connecting…';draw();const r=await call('wifiConnect',ss,pw);wl=await call('wifiList');wl.msg=r.ok?'Connected to '+ss+'.':(r.msg||'Could not connect.');load()}
  else if(a==='bt'){await call('btPower',!S.bs.powered);bd=null;setTimeout(load,800)}

  else if(t.dataset.mac){bd.msg=t.dataset.c==='1'?'Disconnecting…':'Pairing and connecting…';draw();const r=t.dataset.c==='1'?await call('btDisconnect',t.dataset.mac):await call('btConnect',t.dataset.mac);bd=await call('btDevices');bd.msg=r.ok?'Done.':(r.msg||'Failed.');draw()}
  else if(a==='off'||a==='reboot'){call('power',a)}});
 root.addEventListener('input',e=>{if(e.target.id==='vol')call('volSet',+e.target.value)});
 load();const iv=setInterval(()=>{if(!busy.wscan&&!busy.bscan&&!askSsid&&!document.activeElement.closest('.sec input'))load()},8000);rec.close=()=>clearInterval(iv);}},
files:{t:'Files',w:700,h:460,f(b){let dir=null,sel=null,pv='Select a file to preview its details.';const root=el('div');root.style.cssText='display:flex;flex:1;min-height:0';b.append(root);

yadu:{t:'Yadu',w:960,h:600,f(b,rec,arg){const tabs=[];let cur=-1;const HOME='https://www.google.com';
 const strip=el('div','tabs'),tool=el('div','tool'),view=el('div','view');b.style.overflow='hidden';b.append(strip,tool,view);
 const bk=el('button','',ico('back')),fw=el('button','',ico('fwd')),rl=el('button','',ico('reload')),om=el('input');om.placeholder='Search Google or enter a web address';om.spellcheck=false;tool.append(bk,fw,rl,om);
 const norm=v=>{v=v.trim();if(!v)return HOME;if(/^[a-z][a-z0-9+.-]*:\/\//i.test(v))return v;if(/^(localhost|\d{1,3}(\.\d{1,3}){3})(:\d+)?(\/.*)?$/i.test(v))return 'http://'+v;if(/^[^\s]+\.[a-z]{2,}(:\d+)?([/?#].*)?$/i.test(v))return 'https://'+v;return 'https://www.google.com/search?q='+encodeURIComponent(v)};
 function paintTabs(){strip.innerHTML='';tabs.forEach((t,i)=>{const d=el('div','tab'+(i===cur?' act':''),'<span>'+esc(t.title||'New tab')+'</span><b>✕</b>');d.onclick=e=>{if(e.target.tagName==='B')closeTab(i);else show(i)};strip.append(d)});
  const p=el('button','',ico('plus'));p.style.cssText='width:28px;height:28px;border-radius:8px;display:grid;place-items:center;align-self:center';p.onclick=()=>newTab(HOME);strip.append(p);rl.innerHTML=ico(tabs[cur]&&tabs[cur].loading?'stop':'reload')}
 function show(i){cur=i;tabs.forEach((t,k)=>t.box.style.display=k===i?'block':'none');om.value=tabs[i]?tabs[i].url:'';paintTabs()}
 function newTab(url){const box=el('div');box.style.cssText='position:absolute;inset:0';const msg=el('div','vmsg');let wv;
  if(NATIVE){wv=document.createElement('webview');wv.setAttribute('partition','persist:yadu');wv.setAttribute('allowpopups','')}else{wv=document.createElement('iframe')}
  const t={wv,box,msg,url:norm(url),title:'',loading:true};box.append(wv,msg);view.append(box);tabs.push(t);
  if(NATIVE){wv.addEventListener('page-title-updated',e=>{t.title=e.title;paintTabs()});wv.addEventListener('did-start-loading',()=>{t.loading=true;msg.style.display='none';paintTabs()});wv.addEventListener('did-stop-loading',()=>{t.loading=false;paintTabs()});
   const nav=e=>{if(e.isMainFrame===false)return;t.url=e.url;if(tabs[cur]===t)om.value=t.url};wv.addEventListener('did-navigate',nav);wv.addEventListener('did-navigate-in-page',nav);
   wv.addEventListener('did-fail-load',e=>{if(!e.isMainFrame||e.errorCode===-3)return;msg.innerHTML='<div style="font-size:20px;color:var(--tx)">Can’t reach this page</div><div>'+esc(e.validatedURL||'')+'</div><div class="sm">'+esc(e.errorDescription||'')+'</div><div class="sm">Check your internet connection (Settings → Network).</div>';msg.style.display='flex'})}
  wv.src=t.url;show(tabs.length-1)}
 function closeTab(i){const t=tabs[i];t.box.remove();tabs.splice(i,1);if(!tabs.length){newTab(HOME);return}show(Math.min(i,tabs.length-1))}
 const go=v=>{const t=tabs[cur];if(!t)return;t.url=norm(v);t.msg.style.display='none';if(NATIVE)t.wv.loadURL(t.url);else t.wv.src=t.url;om.value=t.url};
 om.onkeydown=e=>{if(e.key==='Enter'){go(om.value);om.blur()}};om.onfocus=()=>om.select();
 bk.onclick=()=>{const t=tabs[cur];if(NATIVE&&t&&t.wv.canGoBack())t.wv.goBack()};fw.onclick=()=>{const t=tabs[cur];if(NATIVE&&t&&t.wv.canGoForward())t.wv.goForward()};
 rl.onclick=()=>{const t=tabs[cur];if(!t)return;if(NATIVE){t.loading?t.wv.stop():t.wv.reload()}else t.wv.src=t.url};
 rec.nav=u=>newTab(u);rec.close=()=>{tabs.length=0};newTab(arg||HOME);
 if(NATIVE)window.avl.on('newtab',u=>{if(wins.yadu)newTab(u);else openApp('yadu',u)})}},
store:{t:'AVL Store',w:600,h:520,f(b){let cat='All',q='';const s=el('input');s.placeholder='Search apps...';s.style.margin='12px 16px';const cats=['All',...new Set(STORE.map(x=>x.c))],cb=el('div','cat'),ls=el('div');
