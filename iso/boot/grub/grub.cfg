set default=0
set timeout=2
menuentry "AVL OS" {
  linux /casper/vmlinuz boot=casper username=avl hostname=avlos userfullname=AVL fsck.mode=skip
  initrd /casper/initrd
}
menuentry "AVL OS (safe graphics)" {
  linux /casper/vmlinuz boot=casper nomodeset username=avl hostname=avlos userfullname=AVL fsck.mode=skip
  initrd /casper/initrd
}
